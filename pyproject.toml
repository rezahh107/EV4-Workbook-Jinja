[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elementor-v4-offline-workbook-builder"
version = "1.1.0"
description = "Deterministic Jinja2 and markdown-it-py generator for the offline Elementor V4 workbook"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4==4.14.3",
  "Jinja2==3.1.6",
  "jsonschema==4.26.0",
  "markdown-it-py==4.2.0",
  "PyYAML==6.0.3"
]

[project.optional-dependencies]
test = [
  "playwright==1.61.0",
  "pytest==9.0.2"
]

[project.scripts]
workbook-builder = "workbook_builder.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "browser: Chromium smoke tests"
]
