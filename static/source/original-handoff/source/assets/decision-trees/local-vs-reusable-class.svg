<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">انتخاب Local Class، Reusable Class، Variable یا Component</title>
<desc id="desc">انتخاب Local Class، Reusable Class، Variable یا Component؛ نمودار تصمیم آموزشی برای Elementor V4</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity="0.14"/>
  </filter>
  <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
  </marker>
  <marker id="arrow-yellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#b7791f"/>
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#c53030"/>
  </marker>
  <style>
    .title { font: 700 32px Tahoma, sans-serif; fill:#15322e; }
    .label { font: 600 23px Tahoma, sans-serif; fill:#15322e; }
    .small { font: 500 19px Tahoma, sans-serif; fill:#36524c; }
    .box { fill:#ffffff; stroke:#0f766e; stroke-width:3; rx:18; filter:url(#shadow); }
    .question { fill:#f0fdfa; stroke:#0f766e; stroke-width:3; filter:url(#shadow); }
    .warn { fill:#fff7ed; stroke:#c05621; stroke-width:3; rx:18; filter:url(#shadow); }
    .good { fill:#ecfdf5; stroke:#047857; stroke-width:3; rx:18; filter:url(#shadow); }
    .muted { fill:#f8fafc; stroke:#64748b; stroke-width:2; rx:18; }
    .line-green { fill:none; stroke:#0f766e; stroke-width:4; marker-end:url(#arrow-green); }
    .line-yellow { fill:none; stroke:#b7791f; stroke-width:4; marker-end:url(#arrow-yellow); }
    .line-red { fill:none; stroke:#c53030; stroke-width:4; marker-end:url(#arrow-red); }
  </style>
</defs>
<rect width="100%" height="100%" fill="#f5faf9"/>
<text x="600.0" y="54" text-anchor="middle" class="title" direction="rtl">انتخاب Local Class، Reusable Class، Variable یا Component</text>
<polygon points="600,90.0 830.0,145 600,200.0 370.0,145" class="question"/>
<text x="600" y="145" text-anchor="middle" class="label" direction="rtl">چه چیزی تکرار می‌شود؟</text>
<path d="M600,200 L240,310" class="line-green"/>
<path d="M600,200 L480,310" class="line-green"/>
<path d="M600,200 L720,310" class="line-green"/>
<path d="M600,200 L960,310" class="line-green"/>
<rect x="80" y="310" width="300" height="110" class="good"/>
<text x="230.0" y="349.0" text-anchor="middle" class="label" direction="rtl">ظاهر مشترک</text>
<text x="230.0" y="381.0" text-anchor="middle" class="label" direction="rtl">Reusable Class</text>
<rect x="390" y="310" width="250" height="110" class="good"/>
<text x="515.0" y="349.0" text-anchor="middle" class="label" direction="rtl">مقدار مشترک</text>
<text x="515.0" y="381.0" text-anchor="middle" class="label" direction="rtl">Variable</text>
<rect x="650" y="310" width="250" height="110" class="good"/>
<text x="775.0" y="349.0" text-anchor="middle" class="label" direction="rtl">ساختار مشترک</text>
<text x="775.0" y="381.0" text-anchor="middle" class="label" direction="rtl">Component</text>
<rect x="910" y="310" width="240" height="110" class="good"/>
<text x="1030.0" y="349.0" text-anchor="middle" class="label" direction="rtl">تفاوت یکتا</text>
<text x="1030.0" y="381.0" text-anchor="middle" class="label" direction="rtl">Local Class</text>
<rect x="360" y="500" width="480" height="120" class="warn"/>
<text x="600.0" y="544.0" text-anchor="middle" class="label" direction="rtl">اگر Reusable Class کار نکرد</text>
<text x="600.0" y="576.0" text-anchor="middle" class="label" direction="rtl">اول Local Class و Active Class را بررسی کن</text>
<path d="M600,420 L600,500" class="line-yellow"/>
</svg>
