<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Normal Flow یا Absolute Position</title>
<desc id="desc">Normal Flow یا Absolute Position؛ نمودار تصمیم آموزشی برای Elementor V4</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity="0.14"/>
  </filter>
  <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
  </marker>
  <marker id="arrow-yellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#b7791f"/>
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#c53030"/>
  </marker>
  <style>
    .title { font: 700 32px Tahoma, sans-serif; fill:#15322e; }
    .label { font: 600 23px Tahoma, sans-serif; fill:#15322e; }
    .small { font: 500 19px Tahoma, sans-serif; fill:#36524c; }
    .box { fill:#ffffff; stroke:#0f766e; stroke-width:3; rx:18; filter:url(#shadow); }
    .question { fill:#f0fdfa; stroke:#0f766e; stroke-width:3; filter:url(#shadow); }
    .warn { fill:#fff7ed; stroke:#c05621; stroke-width:3; rx:18; filter:url(#shadow); }
    .good { fill:#ecfdf5; stroke:#047857; stroke-width:3; rx:18; filter:url(#shadow); }
    .muted { fill:#f8fafc; stroke:#64748b; stroke-width:2; rx:18; }
    .line-green { fill:none; stroke:#0f766e; stroke-width:4; marker-end:url(#arrow-green); }
    .line-yellow { fill:none; stroke:#b7791f; stroke-width:4; marker-end:url(#arrow-yellow); }
    .line-red { fill:none; stroke:#c53030; stroke-width:4; marker-end:url(#arrow-red); }
  </style>
</defs>
<rect width="100%" height="100%" fill="#f5faf9"/>
<text x="600.0" y="54" text-anchor="middle" class="title" direction="rtl">Normal Flow یا Absolute Position</text>
<polygon points="600,85.0 850.0,145 600,205.0 350.0,145" class="question"/>
<text x="600" y="130" text-anchor="middle" class="label" direction="rtl">آیا هم‌پوشانی عمدی</text>
<text x="600" y="160" text-anchor="middle" class="label" direction="rtl">بخشی از طراحی است؟</text>
<path d="M600,205 L310,325" class="line-green"/>
<path d="M600,205 L890,325" class="line-green"/>
<rect x="100" y="325" width="420" height="120" class="good"/>
<text x="310.0" y="369.0" text-anchor="middle" class="label" direction="rtl">خیر: Normal Flow</text>
<text x="310.0" y="401.0" text-anchor="middle" class="label" direction="rtl">Flexbox یا Grid</text>
<polygon points="890,325.0 1105.0,385 890,445.0 675.0,385" class="question"/>
<text x="890" y="385" text-anchor="middle" class="label" direction="rtl">عنصر تزئینی یا Badge است؟</text>
<path d="M890,445 L690,555" class="line-green"/>
<path d="M890,445 L1070,555" class="line-red"/>
<rect x="500" y="555" width="380" height="110" class="good"/>
<text x="690.0" y="594.0" text-anchor="middle" class="label" direction="rtl">بله: Parent Relative</text>
<text x="690.0" y="626.0" text-anchor="middle" class="label" direction="rtl">Child Absolute</text>
<rect x="900" y="555" width="250" height="110" class="warn"/>
<text x="1025.0" y="594.0" text-anchor="middle" class="label" direction="rtl">خیر: Absolute پرریسک</text>
<text x="1025.0" y="626.0" text-anchor="middle" class="label" direction="rtl">محتوا را در Flow نگه دار</text>
</svg>
