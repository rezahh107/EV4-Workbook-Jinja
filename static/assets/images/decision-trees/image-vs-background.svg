<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">انتخاب Image، SVG یا Background</title>
<desc id="desc">انتخاب Image، SVG یا Background؛ نمودار تصمیم آموزشی برای Elementor V4</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity="0.14"/>
  </filter>
  <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
  </marker>
  <marker id="arrow-yellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#b7791f"/>
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#c53030"/>
  </marker>
  <style>
    .title { font: 700 32px Tahoma, sans-serif; fill:#15322e; }
    .label { font: 600 23px Tahoma, sans-serif; fill:#15322e; }
    .small { font: 500 19px Tahoma, sans-serif; fill:#36524c; }
    .box { fill:#ffffff; stroke:#0f766e; stroke-width:3; rx:18; filter:url(#shadow); }
    .question { fill:#f0fdfa; stroke:#0f766e; stroke-width:3; filter:url(#shadow); }
    .warn { fill:#fff7ed; stroke:#c05621; stroke-width:3; rx:18; filter:url(#shadow); }
    .good { fill:#ecfdf5; stroke:#047857; stroke-width:3; rx:18; filter:url(#shadow); }
    .muted { fill:#f8fafc; stroke:#64748b; stroke-width:2; rx:18; }
    .line-green { fill:none; stroke:#0f766e; stroke-width:4; marker-end:url(#arrow-green); }
    .line-yellow { fill:none; stroke:#b7791f; stroke-width:4; marker-end:url(#arrow-yellow); }
    .line-red { fill:none; stroke:#c53030; stroke-width:4; marker-end:url(#arrow-red); }
  </style>
</defs>
<rect width="100%" height="100%" fill="#f5faf9"/>
<text x="600.0" y="54" text-anchor="middle" class="title" direction="rtl">انتخاب Image، SVG یا Background</text>
<polygon points="600,90.0 835.0,145 600,200.0 365.0,145" class="question"/>
<text x="600" y="130" text-anchor="middle" class="label" direction="rtl">آیا تصویر برای</text>
<text x="600" y="160" text-anchor="middle" class="label" direction="rtl">معنی محتوا ضروری است؟</text>
<path d="M600,200 L315,315" class="line-green"/>
<path d="M600,200 L885,315" class="line-green"/>
<rect x="115" y="315" width="400" height="110" class="good"/>
<text x="315.0" y="354.0" text-anchor="middle" class="label" direction="rtl">بله: Image یا SVG</text>
<text x="315.0" y="386.0" text-anchor="middle" class="label" direction="rtl">Alt و معنی را حفظ کن</text>
<polygon points="885,310.0 1100.0,370 885,430.0 670.0,370" class="question"/>
<text x="885" y="370" text-anchor="middle" class="label" direction="rtl">فقط تزئینی است؟</text>
<path d="M885,430 L690,540" class="line-green"/>
<path d="M885,430 L1065,540" class="line-yellow"/>
<rect x="500" y="540" width="380" height="110" class="good"/>
<text x="690.0" y="579.0" text-anchor="middle" class="label" direction="rtl">بله: Background</text>
<text x="690.0" y="611.0" text-anchor="middle" class="label" direction="rtl">یا SVG تزئینی</text>
<rect x="900" y="540" width="250" height="110" class="warn"/>
<text x="1025.0" y="579.0" text-anchor="middle" class="label" direction="rtl">خیر: هدف تصویر</text>
<text x="1025.0" y="611.0" text-anchor="middle" class="label" direction="rtl">را دوباره مشخص کن</text>
</svg>
