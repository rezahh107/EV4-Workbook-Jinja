<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">اولین مسیر عیب‌یابی در Elementor V4</title>
<desc id="desc">اولین مسیر عیب‌یابی در Elementor V4؛ نمودار تصمیم آموزشی برای Elementor V4</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity="0.14"/>
  </filter>
  <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
  </marker>
  <marker id="arrow-yellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#b7791f"/>
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#c53030"/>
  </marker>
  <style>
    .title { font: 700 32px Tahoma, sans-serif; fill:#15322e; }
    .label { font: 600 23px Tahoma, sans-serif; fill:#15322e; }
    .small { font: 500 19px Tahoma, sans-serif; fill:#36524c; }
    .box { fill:#ffffff; stroke:#0f766e; stroke-width:3; rx:18; filter:url(#shadow); }
    .question { fill:#f0fdfa; stroke:#0f766e; stroke-width:3; filter:url(#shadow); }
    .warn { fill:#fff7ed; stroke:#c05621; stroke-width:3; rx:18; filter:url(#shadow); }
    .good { fill:#ecfdf5; stroke:#047857; stroke-width:3; rx:18; filter:url(#shadow); }
    .muted { fill:#f8fafc; stroke:#64748b; stroke-width:2; rx:18; }
    .line-green { fill:none; stroke:#0f766e; stroke-width:4; marker-end:url(#arrow-green); }
    .line-yellow { fill:none; stroke:#b7791f; stroke-width:4; marker-end:url(#arrow-yellow); }
    .line-red { fill:none; stroke:#c53030; stroke-width:4; marker-end:url(#arrow-red); }
  </style>
</defs>
<rect width="100%" height="100%" fill="#f5faf9"/>
<text x="600.0" y="54" text-anchor="middle" class="title" direction="rtl">اولین مسیر عیب‌یابی در Elementor V4</text>
<rect x="420" y="95" width="360" height="90" class="box"/>
<text x="600.0" y="140.0" text-anchor="middle" class="label" direction="rtl">نشانهٔ مشکل را دقیق بنویس</text>
<path d="M600,185 L600,235" class="line-green"/>
<polygon points="600,240.0 835.0,300 600,360.0 365.0,300" class="question"/>
<text x="600" y="285" text-anchor="middle" class="label" direction="rtl">کدام Element و Parent</text>
<text x="600" y="315" text-anchor="middle" class="label" direction="rtl">مسئول این رفتارند؟</text>
<path d="M600,360 L305,475" class="line-green"/>
<path d="M600,360 L600,475" class="line-green"/>
<path d="M600,360 L895,475" class="line-green"/>
<rect x="90" y="475" width="420" height="110" class="good"/>
<text x="300.0" y="514.0" text-anchor="middle" class="label" direction="rtl">Active Class و Local Override</text>
<text x="300.0" y="546.0" text-anchor="middle" class="label" direction="rtl">را بررسی کن</text>
<rect x="435" y="475" width="330" height="110" class="good"/>
<text x="600.0" y="514.0" text-anchor="middle" class="label" direction="rtl">Device Size و State</text>
<text x="600.0" y="546.0" text-anchor="middle" class="label" direction="rtl">را بررسی کن</text>
<rect x="790" y="475" width="320" height="110" class="good"/>
<text x="950.0" y="514.0" text-anchor="middle" class="label" direction="rtl">یک Property را تغییر بده</text>
<text x="950.0" y="546.0" text-anchor="middle" class="label" direction="rtl">نتیجه را Undo کن</text>
<rect x="395" y="635" width="410" height="80" class="warn"/>
<text x="600.0" y="675.0" text-anchor="middle" class="label" direction="rtl">Element یا Class جدید را فقط بعد از یافتن علت اضافه کن</text>
<path d="M600,585 L600,635" class="line-yellow"/>
</svg>
