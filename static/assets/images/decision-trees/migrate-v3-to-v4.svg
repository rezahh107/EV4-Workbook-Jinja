<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">نردبان مهاجرت کنترل‌شده از V3 به V4</title>
<desc id="desc">نردبان مهاجرت کنترل‌شده از V3 به V4؛ نمودار تصمیم آموزشی برای Elementor V4</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity="0.14"/>
  </filter>
  <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
  </marker>
  <marker id="arrow-yellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#b7791f"/>
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#c53030"/>
  </marker>
  <style>
    .title { font: 700 32px Tahoma, sans-serif; fill:#15322e; }
    .label { font: 600 23px Tahoma, sans-serif; fill:#15322e; }
    .small { font: 500 19px Tahoma, sans-serif; fill:#36524c; }
    .box { fill:#ffffff; stroke:#0f766e; stroke-width:3; rx:18; filter:url(#shadow); }
    .question { fill:#f0fdfa; stroke:#0f766e; stroke-width:3; filter:url(#shadow); }
    .warn { fill:#fff7ed; stroke:#c05621; stroke-width:3; rx:18; filter:url(#shadow); }
    .good { fill:#ecfdf5; stroke:#047857; stroke-width:3; rx:18; filter:url(#shadow); }
    .muted { fill:#f8fafc; stroke:#64748b; stroke-width:2; rx:18; }
    .line-green { fill:none; stroke:#0f766e; stroke-width:4; marker-end:url(#arrow-green); }
    .line-yellow { fill:none; stroke:#b7791f; stroke-width:4; marker-end:url(#arrow-yellow); }
    .line-red { fill:none; stroke:#c53030; stroke-width:4; marker-end:url(#arrow-red); }
  </style>
</defs>
<rect width="100%" height="100%" fill="#f5faf9"/>
<text x="600.0" y="54" text-anchor="middle" class="title" direction="rtl">نردبان مهاجرت کنترل‌شده از V3 به V4</text>
<rect x="440" y="100" width="320" height="80" class="box"/>
<text x="600.0" y="140.0" text-anchor="middle" class="label" direction="rtl">۱. عنصر Legacy را تشخیص بده</text>
<path d="M600,180 L600,225" class="line-green"/>
<rect x="440" y="225" width="320" height="80" class="box"/>
<text x="600.0" y="265.0" text-anchor="middle" class="label" direction="rtl">۲. نقش و داده را ثبت کن</text>
<path d="M600,305 L600,350" class="line-green"/>
<rect x="440" y="350" width="320" height="80" class="good"/>
<text x="600.0" y="390.0" text-anchor="middle" class="label" direction="rtl">۳. معادل V4 را در Staging بساز</text>
<path d="M600,430 L600,475" class="line-green"/>
<rect x="440" y="475" width="320" height="80" class="box"/>
<text x="600.0" y="515.0" text-anchor="middle" class="label" direction="rtl">۴. Desktop / Mobile / A11y را مقایسه کن</text>
<path d="M600,555 L600,600" class="line-green"/>
<rect x="440" y="600" width="320" height="80" class="good"/>
<text x="600.0" y="640.0" text-anchor="middle" class="label" direction="rtl">۵. فقط پس از تأیید جایگزین کن</text>
<rect x="70" y="310" width="280" height="120" class="muted"/>
<text x="210.0" y="354.0" text-anchor="middle" class="label" direction="rtl">Hybrid بودن</text>
<text x="210.0" y="386.0" text-anchor="middle" class="label" direction="rtl">به‌تنهایی خرابی نیست</text>
<path d="M350,370 L440,390" class="line-yellow"/>
</svg>
