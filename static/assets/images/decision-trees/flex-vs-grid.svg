<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">تصمیم Flexbox یا Grid</title>
<desc id="desc">تصمیم Flexbox یا Grid؛ نمودار تصمیم آموزشی برای Elementor V4</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity="0.14"/>
  </filter>
  <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
  </marker>
  <marker id="arrow-yellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#b7791f"/>
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#c53030"/>
  </marker>
  <style>
    .title { font: 700 32px Tahoma, sans-serif; fill:#15322e; }
    .label { font: 600 23px Tahoma, sans-serif; fill:#15322e; }
    .small { font: 500 19px Tahoma, sans-serif; fill:#36524c; }
    .box { fill:#ffffff; stroke:#0f766e; stroke-width:3; rx:18; filter:url(#shadow); }
    .question { fill:#f0fdfa; stroke:#0f766e; stroke-width:3; filter:url(#shadow); }
    .warn { fill:#fff7ed; stroke:#c05621; stroke-width:3; rx:18; filter:url(#shadow); }
    .good { fill:#ecfdf5; stroke:#047857; stroke-width:3; rx:18; filter:url(#shadow); }
    .muted { fill:#f8fafc; stroke:#64748b; stroke-width:2; rx:18; }
    .line-green { fill:none; stroke:#0f766e; stroke-width:4; marker-end:url(#arrow-green); }
    .line-yellow { fill:none; stroke:#b7791f; stroke-width:4; marker-end:url(#arrow-yellow); }
    .line-red { fill:none; stroke:#c53030; stroke-width:4; marker-end:url(#arrow-red); }
  </style>
</defs>
<rect width="100%" height="100%" fill="#f5faf9"/>
<text x="600.0" y="54" text-anchor="middle" class="title" direction="rtl">تصمیم Flexbox یا Grid</text>
<polygon points="600,90.0 835.0,150 600,210.0 365.0,150" class="question"/>
<text x="600" y="135" text-anchor="middle" class="label" direction="rtl">مسئلهٔ اصلی فقط</text>
<text x="600" y="165" text-anchor="middle" class="label" direction="rtl">روی یک محور است؟</text>
<path d="M600,210 L315,325" class="line-green"/>
<path d="M600,210 L885,325" class="line-green"/>
<rect x="120" y="325" width="390" height="115" class="good"/>
<text x="315.0" y="366.5" text-anchor="middle" class="label" direction="rtl">بله: Flexbox</text>
<text x="315.0" y="398.5" text-anchor="middle" class="label" direction="rtl">Row یا Column</text>
<polygon points="885,320.0 1100.0,380 885,440.0 670.0,380" class="question"/>
<text x="885" y="365" text-anchor="middle" class="label" direction="rtl">ردیف و ستون را</text>
<text x="885" y="395" text-anchor="middle" class="label" direction="rtl">هم‌زمان کنترل می‌کنی؟</text>
<path d="M885,440 L685,550" class="line-green"/>
<path d="M885,440 L1070,550" class="line-yellow"/>
<rect x="490" y="550" width="390" height="110" class="good"/>
<text x="685.0" y="605.0" text-anchor="middle" class="label" direction="rtl">بله: Grid</text>
<rect x="900" y="550" width="250" height="110" class="warn"/>
<text x="1025.0" y="589.0" text-anchor="middle" class="label" direction="rtl">خیر: ساختار را</text>
<text x="1025.0" y="621.0" text-anchor="middle" class="label" direction="rtl">دوباره تحلیل کن</text>
</svg>
